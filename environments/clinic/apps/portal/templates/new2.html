{% extends "base.html" %}{% block body %}
<div class="steps"><span class="step done">1. Patient details</span><span class="step on">2. Clinic and time</span><span class="step">3. Review and submit</span></div>
<div class="card" style="max-width:560px;margin:0 auto">
<h2>Clinic and time</h2>
<p class="hint">Pick a slot that is not already taken on this date.</p>
<form method="post">
<label>Clinic <span class="req">*</span></label>
<select name="clinic" required><option value="">-- select --</option>
{% for c in clinics %}<option {% if wiz.get('clinic')==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
<label>Vaccine <span class="req">*</span></label>
<select name="vaccine" required><option value="">-- select --</option>
{% for v in vaccines %}<option {% if wiz.get('vaccine')==v %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
<label>Date <span class="req">*</span></label>
<input name="date" type="date" value="{{ wiz.get('date','') }}" required>
<label>Time slot <span class="req">*</span></label>
<select name="slot" required><option value="">-- select --</option>
{% for s in slots %}<option {% if wiz.get('slot')==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select>
<div class="hint">Check the appointment list first — a slot already booked for this date is not available.</div>
<label>Notes</label>
<textarea name="notes" rows="3">{{ wiz.get('notes','') }}</textarea>
<p style="margin-top:16px"><button class="btn">Continue</button> <a class="btn gray" href="/new">Back</a></p>
</form></div>
{% endblock %}

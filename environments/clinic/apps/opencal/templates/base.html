<!doctype html>
<meta charset="utf-8">
<title>OpenCal — Calendar</title>
<style>
 * { box-sizing:border-box }
 body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#17222b; background:#f5f7f9 }
 .mast { background:#20558a; color:#fff; padding:10px 22px; display:flex; align-items:center; gap:20px }
 .mast b { font-size:15px }
 .mast a { color:#d5e5f5; font-size:13px; text-decoration:none }
 main { max-width:1100px; margin:20px auto; padding:0 16px }
 .grid { display:grid; grid-template-columns:70px repeat(3, 1fr); background:#fff; border:1px solid #dbe3ea; border-radius:6px; overflow:hidden }
 .cell { border-bottom:1px solid #edf1f5; border-right:1px solid #edf1f5; min-height:42px; font-size:11px; padding:2px 4px; position:relative }
 .head { background:#eef3f8; font-weight:600; font-size:12px; text-align:center; padding:8px 4px }
 .hour { color:#7b8894; font-size:11px; text-align:right; padding-right:8px; padding-top:2px }
 .ev { background:#2c6cb0; color:#fff; border-radius:3px; padding:2px 6px; margin:1px 0; font-size:11px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
 .btn { display:inline-block; background:#20558a; color:#fff; border:0; border-radius:4px; padding:8px 18px; font-size:13px; cursor:pointer; text-decoration:none }
 label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px }
 input { width:100%; padding:8px 10px; font-size:13px; border:1px solid #c6d2dd; border-radius:4px }
 .card { background:#fff; border:1px solid #dbe3ea; border-radius:6px; padding:22px 26px; max-width:520px; margin:0 auto }
</style>
<div class="mast"><b>OpenCal</b><a href="/">Week</a><a href="/new">+ New event</a>
 <span style="margin-left:auto;font-size:12px;color:#cfe0f2">Clinic Scheduler</span></div>
<main>{% block body %}{% endblock %}</main>
